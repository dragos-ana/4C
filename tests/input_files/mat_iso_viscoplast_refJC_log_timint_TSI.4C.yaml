TITLE:
  - "Simple test case based on 1hex8 element with isotropic elastic-viscoplastic"
  - "behavior in a finite strain setting. The following conditions are assumed:"
  - "- element is stretched at a constant strain rate"
  - "- element can freely contract in lateral dimensions"
  - "- viscoplasticity law: flow rule and hardening behavior modeled with the"
  - "Reformulated Johnson-Cook law, as shown in:"
  - "Mareau: A thermodynamically consistent formulation of the Johnson-Cook"
  - "model, Mechanics of Materials 143, 2020"
  - "- time integration of internal variables using logarithmic substepping, as shown in:"
  - "Ana: Continuum Modeling and Calibration of Viscoplasticity in the Context"
  - "of the Lithium Anode in Solid-State Batteries"
  - "(Master's Thesis, Institute for Computational Mechanics, TU Munich, 2024)"
PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"
IO:
  STRUCT_STRESS: "Cauchy"
  STRUCT_STRAIN: "LOG"
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  STRESS_STRAIN: true
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
STRUCTURAL DYNAMIC:
  INT_STRATEGY: "Standard"
  DYNAMICTYPE: OneStepTheta
  RESTARTEVERY: 30
  TIMESTEP: 1e-06
  NUMSTEP: 100000000
  MAXTIME: 0.0001
  TOLDISP: 1e-8
  NORM_DISP: Rel
  TOLRES: 1e-8
  NORM_RESF: Rel
  NEGLECTINERTIA: true
  LINEAR_SOLVER: 1
THERMAL DYNAMIC:
  DYNAMICTYPE: OneStepTheta
  RESULTSEVERY: 1
  RESTARTEVERY: 1
  INITIALFIELD: zero_field
  INITFUNCNO: -1
  TIMESTEP: 0.05
  NUMSTEP: 200
  MAXTIME: 5
  TOLTEMP: 1e-8
  NORM_TEMP: Rel
  TOLRES: 1e-8
  NORM_RESF: Rel
  NORMCOMBI_RESFTEMP: And
  MAXITER: 50
  MINITER: 0
  ITERNORM: L2
  DIVERCONT: stop
  MAXDIVCONREFINEMENTLEVEL: 10
  NLNSOL: fullnewton
  PREDICT: ConstTemp
  ADAPTCONV: false
  ADAPTCONV_BETTER: 0.1
  LUMPCAPA: false
  LINEAR_SOLVER: 1
  CALCERROR: "No"
  CALCERRORFUNCNO: -1
THERMAL DYNAMIC/RUNTIME VTK OUTPUT:
  OUTPUT_THERMO: true
  TEMPERATURE: true
TSI DYNAMIC:
  COUPALGO: tsi_monolithic
  MATCHINGGRID: true
  RESTARTEVERY: 1
  NUMSTEP: 100000000
  MAXTIME: 0.02 # [s]
  TIMESTEP: 1e-4 # [s]
  ITEMAX: 20
  ITEMIN: 0
  RESULTSEVERY: 1
  NORM_INC: Rel
TSI DYNAMIC/MONOLITHIC:
  LINEAR_SOLVER: 1
  MERGE_TSI_BLOCK_MATRIX: true
  TOLINC: 1e-8
  CONVTOL: 1e-8
  NORM_RESF: Rel
SOLVER 1:
  SOLVER: "Superlu"
SOLVER 2:
  SOLVER: Belos
  SOLVER_XML_FILE: "xml/linear_solver/iterative_gmres_template.xml"
  TEKO_XML_FILE: "xml/block_preconditioner/thermo_solid.xml"
MATERIALS:
  - MAT: 1
    MAT_MultiplicativeSplitDefgradElastHyper:
      NUMMATEL: 1
      MATIDSEL: [2]
      NUMFACINEL: 1
      INELDEFGRADFACIDS: [3]
      DENS: 7830e-12 # [t/mm^3 = N*s^2/mm^4]
      REF_TEMPERATURE: 293 # [K]
      THERMAL_EXPANSION_FAC: 11e-6 # [1/K]
  - MAT: 2
    ELAST_CoupNeoHooke:
      YOUNG: 200e3 # [N/mm^2]
      NUE: 0.29 # [-]
  - MAT: 3
    MAT_InelasticDefgradTransvIsotropElastViscoplast:
      VISCOPLAST_LAW_ID: 4
      TAYLOR_QUINNEY_FACTOR: 0.85 # [-]
      FIBER_READER_ID: 5
      YIELD_COND_A: 0
      YIELD_COND_B: 0
      YIELD_COND_F: 0
      MAT_BEHAVIOR: isotrop
      MAX_SUBSTEPPING_HALVE_NUM: 1
  - MAT: 4
    MAT_ViscoplasticLawReformulatedJohnsonCook:
      STRAIN_RATE_PREFAC: 1 # [1/s]
      STRAIN_RATE_EXP_FAC: 0.014 # [-]
      INIT_YIELD_STRENGTH: 792 # [N/mm^2]
      ISOTROP_HARDEN_PREFAC: 510 # [N/mm^2]
      ISOTROP_HARDEN_EXP: 0.26 # [-]
      REF_TEMPERATURE: 293 # [K]
      MELT_TEMPERATURE: 1793 # [K]
      TEMPERATURE_SENS: 1.03 # [-]
  - MAT: 5
    ELAST_CoupTransverselyIsotropic:
      ALPHA: 1
      BETA: 1
      GAMMA: 1
      ANGLE: 0
      STR_TENS_ID: 100
  - MAT: 100
    ELAST_StructuralTensor:
      STRATEGY: "Standard"

  - MAT: 10
    MAT_Fourier:
      CAPA: 3.734910 # [mJ/(mm^3*K) = N/(mm^2*K)]
      CONDUCT:
        constant: [37] # [mW/(mm*K) = N/s/K]

CLONING MATERIAL MAP:
  - SRC_FIELD: structure
    SRC_MAT: 1
    TAR_FIELD: thermo
    TAR_MAT: 10

FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "multifunction"
    NUMPOINTS: 2
    TIMES: [0, 1.6e+16]
    DESCRIPTION: ["(exp(1.0e2*t)-1.0)"] # [mm]
