TITLE:
  - "Simulation of a viscoplastic HEX8 element under uniaxial tension with a constant strain rate of $1
    \\ \\mathrm{s}^{-1}$, as shown in Ana, Schmidt, Wall: Accelerating Local Newton--Raphson Schemes in
    Computational Plasticity / Viscoplasticity."
  - "The adaptive estimate interpolation scheme is used for local time integration, in order to determine
    efficient initial and updated estimates (due to re-estimations) for the Local Newton--Raphson procedure."
  - "The accumulated plastic strain of the estimates is integrated according to its evolution equation,
    consistent with the interpolated elastic deformation gradient."
  - "The starting point of the adaptive estimate interpolation procedure is set as the optimal point based
    on the solution equivalent stress, in relation to the elastic and plastic predictors."
  - "A smaller timestep is used compared to the referenced publication, to also simulate restart."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
IO:
  STRUCT_STRESS: "Cauchy"
  STRUCT_STRAIN: "log"
  STDOUTEVERY: 1 # template parameter
  VERBOSITY: minimal
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  STRESS_STRAIN: true
  GAUSS_POINT_DATA_OUTPUT_TYPE: gauss_points
IO/RUNTIME VTK OUTPUT:
  EVERY_ITERATION: false
  INTERVAL_STEPS: 1 # template parameter
STRUCTURAL DYNAMIC:
  INT_STRATEGY: "Standard"
  DYNAMICTYPE: "Statics"
  RESTARTEVERY: 1
  TIMESTEP: 0.1 # template parameter
  NUMSTEP: 5000000
  MAXTIME: 1.0 # template parameter (according to strain rate below)
  TOLDISP: 1e-06
  NORM_DISP: Abs
  TOLRES: 1e-06
  NORM_RESF: Abs
  NEGLECTINERTIA: true
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "multifunction"
    NUMPOINTS: 2
    TIMES: [0.0, 1.6e+16]
    DESCRIPTION: ["exp(1.0 * t) - 1.0"]
MATERIALS:
  - MAT: 1
    MAT_MultiplicativeSplitDefgradElastHyper:
      NUMMATEL: 1
      MATIDSEL: [2]
      NUMFACINEL: 1
      INELDEFGRADFACIDS: [3]
      DENS: 7830
  - MAT: 2
    ELAST_CoupSVK:
      YOUNG: 2.0e5
      NUE: 0.29
  - MAT: 3
    MAT_InelasticDefgradTransvIsotropElastViscoplast:
      LOCAL_NEWTON:
        CONV_CHECK: residual_and_increment_ratio
        MAX_ITER: 100
        RES_TOL: 1.0e-10
        INCR_TOL: 1.0e-10
        DIVER_CONT: stop
      ADAPTIVE_ESTIMATE_INTERP:
        USE_ADAPTIVE_ESTIMATE_INTERP: True
        STARTING_POINT_TYPE: user_set
        USER_SET_STARTING_POINT: 0.5
        PLASTIC_PRED_ELASTIC_STRETCH_EIGENVAL_TYPE: scale_unit
        PLASTIC_PRED_ELASTIC_STRETCH_EIGENVECT_TYPE: from_elastic_predictor
        PLASTIC_PRED_ELASTIC_ROTATION_TYPE: from_elastic_predictor
        MAX_NUM_PLASTIC_PRED_CONSTRUCT_ITERS: 50
        MAX_RELATIVE_YIELD_STRESS_DEVIATION: 1.0e-6
        MAX_NUM_ESTIMATE_INTERP_ITERS: 50
        MIN_INTERP_INTERVAL: 1e-15
        INTERVAL_SCANNING_PARAM: 0.5
        MAX_NUM_REESTIMATIONS: 10
        MIN_REESTIMATION_INTERVAL: 1.0e-5
        PRECONDITION_ELASTIC_PRED: true
        TOL_PRECONDITION_ELASTIC_PRED: 1.0e-13
        HARDENING_PARAMS:
          METHOD: integrate_via_evol_eqs
          ALLOW_INTEGRATION_FAILURE: true
          FAILURE_RELATIVE_YIELD_STRESS_DEVIATION: 1.0e3
          MAX_ITER_INTEGRATION: 50
          TOL_INTEGRATION: 1.0e-8
      ERROR_REGISTRATION_SETTINGS:
        REGISTER_PLASTIC_STRAIN_INCR_OVERFLOW: True
        MAX_PLASTIC_STRAIN_INCR: 1.0e12
      FIBER_READER_ID: 5
      LINEARIZATION: analytic
      MATRIX_EXP_CALC_METHOD: automatic
      MATRIX_EXP_DERIV_CALC_METHOD: automatic
      MATRIX_LOG_CALC_METHOD: inv_scal_square
      MATRIX_LOG_DERIV_CALC_METHOD: pade_part_fract
      MAT_BEHAVIOR: isotropic
      TIME_INTEGRATION_HIST_VARS: logarithmic
      VISCOPLAST_LAW_ID: 4
      YIELD_COND_A: 0
      YIELD_COND_B: 0
      YIELD_COND_F: 0
  - MAT: 4
    MAT_ViscoplasticLawReformulatedJohnsonCook:
      STRAIN_RATE_PREFAC: 1
      STRAIN_RATE_EXP_FAC: 0.014
      INIT_YIELD_STRENGTH: 792.0
      ISOTROP_HARDEN_PREFAC: 510.0
      ISOTROP_HARDEN_EXP: 0.26
      REF_TEMPERATURE: 293
      MELT_TEMPERATURE: 1000
      TEMPERATURE_SENS: 0.1
  - MAT: 5
    ELAST_CoupTransverselyIsotropic:
      ALPHA: 1
      BETA: 1
      GAMMA: 1
      ANGLE: 0
      STR_TENS_ID: 100
  - MAT: 100
    ELAST_StructuralTensor:
      STRATEGY: "Standard"
